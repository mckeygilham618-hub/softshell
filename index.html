<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* 表情用系统自带的彩色表情字体渲染。长什么样由用户自己的 Windows/Mac 决定，
     所以这里只点名字体，不带任何图片资源。 */
  body {
    margin: 0; background: #ededed; display: flex; flex-direction: row;
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei",
          "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color: #1a1a1a;
  }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }

  /* ── 左侧会话列表（照微信）── */
  #sidebar {
    width: 232px; flex: none; background: #f4f4f4; border-right: 1px solid #ddd;
    display: flex; flex-direction: column; height: 100%;
  }
  #sbtop {
    padding: 10px; flex: none; display: flex; gap: 8px; align-items: center;
  }
  #newconv {
    flex: 1; border: 1px solid #ccc; background: #fbfbfb; border-radius: 6px;
    padding: 6px 0; font-size: 13px; color: #555; cursor: pointer;
  }
  #newconv:hover { background: #fff; }

  function stickerUrl(id) { return '/sticker?f=' + encodeURIComponent(id); }

  function esc(s) {
    // 也转义引号：文件名会被塞进 title/alt 属性里
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function unesc(s) {
    return s.replace(/&quot;/g, '"').replace(/&gt;/g, '>')
            .replace(/&lt;/g, '<').replace(/&amp;/g, '&');
  }
  function md(s) {
    var parts = String(s).split('```');
    var html = '';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (i % 2 === 1) {
        var nl = p.indexOf('\n');
        var code = nl >= 0 ? p.slice(nl + 1) : p;
        html += '<pre>' + esc(code) + '</pre>';
      } else {
        var t = esc(p);
        // Claude 写 [[表情:名字]] 就渲染成那张表情包；认不出的名字原样留着，好排查
        t = t.replace(/\[\[(?:表情|sticker)[:：]\s*([^\]]+?)\s*\]\]/g, function (m, name) {
          var id = STK_MAP[unesc(name)];
          return id ? '<img class="sticker" src="' + stickerUrl(id) + '" alt="' + name + '">' : m;
        });
        t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        html += mdBlocks(t);
      }
    }
    return html;
  }
  function avatarHtml(who) {
    var rel = LOOK['avatar_' + who] || '';
    var img = rel
      ? '<img src="' + stickerUrl(rel) + '" style="display:block" ' +
        'onerror="this.style.display=\'none\'">'
      : '<img style="display:none">';
    return '<div class="avatar ' + who + '">' + img + '</div>';
  }
  /* 逐行解析：表格、标题、无序列表。输入已转义、已做完行内替换。 */
  function mdBlocks(t) {
    var lines = t.split('\n');
    var html = '', listBuf = [], tblBuf = [];
    function flushList() {
      if (!listBuf.length) return;
      html += '<ul>' + listBuf.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
      listBuf = [];
    }
    function flushTbl() {
      if (!tblBuf.length) return;
      if (tblBuf.length < 2) {           // 孤行竖线不是表格，原样放回
        html += tblBuf.join('<br>') + '<br>';
        tblBuf = [];
        return;
      }
      var rows = tblBuf.map(function (l) {
        return l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
      });
      var start = /^[\s|:-]+$/.test(tblBuf[1]) ? 2 : 1;   // 有分隔行就跳过
      var h = '<div class="tblwrap"><table><tr>' +
        rows[0].map(function (c) { return '<th>' + c.trim() + '</th>'; }).join('') + '</tr>';
      for (var r = start; r < rows.length; r++) {
        h += '<tr>' + rows[r].map(function (c) { return '<td>' + c.trim() + '</td>'; }).join('') + '</tr>';
      }
      html += h + '</table></div>';
      tblBuf = [];
    }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i], m;
      if (/^\s*\|.*\|\s*$/.test(ln)) { flushList(); tblBuf.push(ln); continue; }
      flushTbl();
      if (m = ln.match(/^#{1,4}\s+(.*)$/)) { flushList(); html += '<div class="mdh">' + m[1] + '</div>'; continue; }
      if (m = ln.match(/^\s*[-*•]\s+(.*)$/)) { listBuf.push(m[1]); continue; }
      flushList();
      html += ln + (i < lines.length - 1 ? '<br>' : '');
    }
    flushList(); flushTbl();
    return html;
  }

  function bubble(cls, html, member) {

      var img = member.avatar

        : '<img style="display:none">';
      d.innerHTML = '<div class="avatar claude mavatar">' + img + '</div>' +
        '<div class="bcol"><div class="mname">' + esc(member.name || '') + '</div>' +
        inner + '</div>';
    }
    else if (cls === 'bot') d.innerHTML = avatarHtml('claude') + inner;
    else if (cls === 'user') d.innerHTML = inner + avatarHtml('user');
    else d.innerHTML = inner;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;

  function paintStatus() {
    if (!statEl) return;

  }
  function startStatus(el) {
    statEl = el; statT0 = Date.now();

    if (statTimer) clearInterval(statTimer);

  function handle(ev) {
    var m = ev.member;   // 群聊事件带着"这是谁说的"
    var who = m ? '「' + m.name + '」' : '';
    if (ev.kind === 'text') { bubble('bot', md(ev.text), m); setStatus(who + '继续输出中'); }
    else if (ev.kind === 'thinking') {
      bubble('thought', (m ? esc(m.name) + '：' : '') + md(ev.text));
      setStatus(who + '思考中');
    }
    else if (ev.kind === 'tool') {
      chip('⚙ ' + (m ? m.name + ' · ' : '') + ev.name + (ev.detail ? ' · ' + ev.detail : ''));
      setStatus(who + '正在用 ' + ev.name);
    }
    else if (ev.kind === 'session') setStatus('等待Claude响应');
    else if (ev.kind === 'status') setStatus(ev.text);
    else if (ev.kind === 'note') chip(ev.text);
    else if (ev.kind === 'error') bubble('bot', '<span class="err">' + md(ev.text) + '</span>', m);
  }

      delete chatCache[ctxKey];
      if (wasCur) { SKEY = ''; chat.innerHTML = ''; }
      return loadSessions().then(loadLook).then(function () {
        if (wasCur && SKEY) renderHistory(SKEY);
      });
    }).catch(function () {});
  });

  /* ── 群聊 ── */
  function curSess() {
    return SESSIONS.filter(function (s) { return s.key === SKEY; })[0];
  }
  var gpanel = document.getElementById('gpanel');
  document.getElementById('newgroup').addEventListener('click', function () {
    if (busy) return;
    var cands = SESSIONS.filter(function (s) { return s.type !== 'group'; });
    if (cands.length < 2) {
      alert('至少要有两个普通会话才能拉群。\n先用「＋新会话」多养几个不同的Claude吧。');
      return;
    }
    var h = '';
    cands.forEach(function (s) {
      h += '<label class="gitem"><input type="checkbox" value="' + s.key + '">' +
           '<span>' + esc(s.name || '未命名') + '</span></label>';
    });
    document.getElementById('glist').innerHTML = h;
    document.getElementById('gname').value = '';
    gpanel.classList.add('open');
  });
  document.getElementById('gcancel').addEventListener('click', function () {
    gpanel.classList.remove('open');
  });
  document.getElementById('gok').addEventListener('click', function () {
    if (busy) return;   // 运行中建群会把残余流灌进新群窗口
    var keys = [];
    gpanel.querySelectorAll('input[type=checkbox]:checked').forEach(function (c) {
      keys.push(c.value);
    });
    if (keys.length < 2) { alert('至少勾选两个会话'); return; }
    fetch('/group/new', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('gname').value.trim(), srckeys: keys
      })
    }).then(function (r) {
      if (!r.ok) { alert('建群失败：桥接返回 ' + r.status + '（可能有效会话不足2个）'); return null; }
      return r.json();
    }).then(function (g) {
        if (!g) return;
        gpanel.classList.remove('open');
        closeSearch();
        snapshotChat();
        SKEY = g.key;
        chat.innerHTML = '';
        chip('群建好了。@成员名字点名发言，可以@多个人；' +
             '不@人的话，话会记在群里，他们下次发言时能看到');
        return loadSessions().then(loadLook);
      }).catch(function () { alert('建群失败：桥接没响应'); });
  });
  // 打个 @ 就弹成员菜单
  var atmenu = document.getElementById('atmenu');
  ta.addEventListener('input', function () {
    var cur = curSess();
    if (!cur || cur.type !== 'group') { atmenu.classList.remove('open'); return; }
    var pos = ta.selectionStart;
    if (pos > 0 && ta.value.charAt(pos - 1) === '@') {
      var h = '<div class="mtitle">@谁发言</div>';
      (cur.members || []).forEach(function (mm) {
        h += '<div class="mi" data-at="' + esc(mm.name) + '"><span>' +
             esc(mm.name) + '</span></div>';
      });
      atmenu.innerHTML = h;
      atmenu.classList.add('open');
    } else {
      atmenu.classList.remove('open');
    }
  });
  atmenu.addEventListener('click', function (e) {
    e.stopPropagation();
    var mi = e.target.closest('.mi');
    if (mi && mi.dataset.at) {
      insertAtCursor(mi.dataset.at + ' ');
      atmenu.classList.remove('open');
    }
  });
  document.addEventListener('click', function () { atmenu.classList.remove('open'); });

  /* ── 聊天档案：回放 / 查找 / 置顶 / 导出 ── */
  function snapshotChat() {
    // 高亮黄框是临时的：先摘掉再存缓存，免得切回来时永久复活
    chat.querySelectorAll('.hl').forEach(function (x) { x.classList.remove('hl'); });
    chatCache[SKEY] = chat.innerHTML;
  }
  function closeSearch() {
    spanel.classList.remove('open');
    SEARCH_LIST = [];   // 搜索快照跟会话走，切走就作废
  }
  var HIST_AVATARS = {};   // 群成员名 → 头像（回放时用）
  function recHtml(m) {
    var h = m.text ? md(m.text) : '';
    (m.stk || []).forEach(function (x) {
      h += '<img class="sticker" src="' + stickerUrl(x) + '">';
    });
    (m.imgs || []).forEach(function (x) {
      h += '<img src="/uploadfile?f=' + encodeURIComponent(x) + '">';
    });
    return h;
  }
  function renderRec(m, idx) {
    var el;
    if (m.who === 'user') el = bubble('user', recHtml(m));
    else if (m.who === 'member') {
      el = bubble('bot', recHtml(m),
                  { name: m.name || '', avatar: HIST_AVATARS[m.name] || '' });
    } else el = bubble('bot', recHtml(m));
    if (el) el.dataset.mi = idx;
  }
  var histSeq = 0;
  function renderHistory(key, full) {
    var seq = ++histSeq;
    return fetch('/history?key=' + encodeURIComponent(key))
      .then(function (r) { return r.json(); })
      .then(function (h) {
        // 切走了 / 有更新的回放请求 / 用户已开始发消息：都不许整屏重画
        if (key !== SKEY || seq !== histSeq || busy) return;
        HIST_AVATARS = h.avatars || {};
        chat.innerHTML = '';
        var list = h.list || [];
        var start = full ? 0 : Math.max(0, list.length - 300);
        if (start > 0) chip('（更早的 ' + start + ' 条没展开，点🔍能搜到）');
        for (var i = start; i < list.length; i++) renderRec(list[i], i);
        chat.scrollTop = chat.scrollHeight;
      }).catch(function () {});
  }

  /* 查找聊天内容 */
  var spanel = document.getElementById('spanel');
  var sqEl = document.getElementById('sq');
  var SEARCH_LIST = [];
  var sCat = 'all';
  var LINK_RE = /https?:\/\/[^\s)"'<>\]]+/;
  var PATH_RE = /(?:[A-Za-z]:[\\\/]|~\/)[^\s"'<>|?*]+/;
  document.getElementById('searchbtn').addEventListener('click', function () {
    if (busy) return;   // 流式进行中定位会整屏重画，等这轮结束
    fetch('/history?key=' + encodeURIComponent(SKEY))
      .then(function (r) { return r.json(); })
      .then(function (h) {
        SEARCH_LIST = h.list || [];
        HIST_AVATARS = h.avatars || HIST_AVATARS;
        sCat = 'all';
        sqEl.value = '';
        paintSTabs();
        renderSearch();
        spanel.classList.add('open');
        sqEl.focus();
      }).catch(function () { chip('搜索打不开：桥接没响应'); });
  });
  document.getElementById('sclose').addEventListener('click', function () {
    spanel.classList.remove('open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && spanel.classList.contains('open')) {
      e.preventDefault();   // 这下Esc用来关面板，不触发停止
      spanel.classList.remove('open');
    }
  });
  function paintSTabs() {
    document.querySelectorAll('#stabs .tab').forEach(function (tb) {
      tb.classList.toggle('on', tb.dataset.cat === sCat);
    });
  }
  document.getElementById('stabs').addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.cat) {
      sCat = e.target.dataset.cat;
      paintSTabs();
      renderSearch();
    }
  });
  sqEl.addEventListener('input', renderSearch);
  function snippetOf(m, q) {
    var txt = m.text || '';
    var mm;
    if (sCat === 'link' && (mm = txt.match(LINK_RE))) return mm[0];
    if (sCat === 'file' && (mm = txt.match(PATH_RE))) return mm[0];
    if (!txt) {
      var n = (m.stk || []).length + (m.imgs || []).length;
      return n ? '[图片/表情包 ×' + n + ']' : '';
    }
    if (q) {
      var i = txt.toLowerCase().indexOf(q);
      if (i > 20) txt = '…' + txt.slice(i - 12);
    }
    return txt.slice(0, 60);
  }
  function renderSearch() {
    var q = sqEl.value.trim().toLowerCase();
    var h = '', shown = 0;
    for (var i = SEARCH_LIST.length - 1; i >= 0 && shown < 200; i--) {
      var m = SEARCH_LIST[i];
      var txt = m.text || '';
      if (sCat === 'img' &&
          !((m.imgs && m.imgs.length) || (m.stk && m.stk.length) ||
            /\[\[(?:表情|sticker)/.test(txt))) continue;
      if (sCat === 'link' && !LINK_RE.test(txt)) continue;
      if (sCat === 'file' && !PATH_RE.test(txt)) continue;
      if (q && txt.toLowerCase().indexOf(q) < 0) continue;
      h += '<div class="sitem" data-mi="' + i + '">' +
           '<div class="srow1"><b>' + esc(m.name || '?') + '</b>' +
           '<span>' + fmtTime(m.ts) + '</span></div>' +
           '<div class="ssnip">' + esc(snippetOf(m, q)) + '</div></div>';
      shown++;
    }
    document.getElementById('sresults').innerHTML =
      h || '<div class="empty">没搜到。只搜落了档的消息——留档从档案功能上线那天开始。</div>';
  }
  document.getElementById('sresults').addEventListener('click', function (e) {
    var it = e.target.closest('.sitem');
    if (!it) return;
    var idx = it.dataset.mi;
    spanel.classList.remove('open');
    function flash() {
      var el = chat.querySelector('[data-mi="' + idx + '"]');
      if (!el) return;
      el.scrollIntoView({ block: 'center' });
      el.classList.add('hl');
      setTimeout(function () { el.classList.remove('hl'); }, 2200);
    }
    if (chat.querySelector('[data-mi="' + idx + '"]')) flash();
    else if (!busy) renderHistory(SKEY, true).then(flash);   // 不在视图里：全量重放再跳
  });

  /* 置顶 / 导出 */
  document.getElementById('ctxpin').addEventListener('click', function () {
    var s = SESSIONS.filter(function (x) { return x.key === ctxKey; })[0];
    if (!s) return;
    fetch('/session/pin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: ctxKey, pin: !s.pin })
    }).then(loadSessions).catch(function () {});
  });
  document.getElementById('ctxexport').addEventListener('click', function () {
    fetch('/export', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: ctxKey })
    }).then(function (r) {
      if (!r.ok) { chip('导出失败：桥接返回 ' + r.status); return null; }
      return r.json();
    }).then(function (j) { if (j) chip('聊天记录已导出：' + j.path); })
      .catch(function () { chip('导出失败：桥接没响应'); });
  });

  /* ── 模型 / effort 切换 ── */
  var modelbtn = document.getElementById('modelbtn');
  var effortbtn = document.getElementById('effortbtn');
  var modelmenu = document.getElementById('modelmenu');
  var effortmenu = document.getElementById('effortmenu');
  var MODEL_NAMES = {
    fable: 'Fable 5', opus: 'Opus 5', sonnet: 'Sonnet 5', haiku: 'Haiku 4.5',
    'claude-opus-4-8': 'Opus 4.8', 'claude-opus-4-7': 'Opus 4.7',
    'claude-opus-4-6': 'Opus 4.6', 'claude-sonnet-4-6': 'Sonnet 4.6',
    opusplan: 'OpusPlan'
  };
  var EFFORT_NAMES = { low: 'Low', medium: 'Medium', high: 'High', xhigh: 'xHigh', max: 'Max' };

  function applyPrefs() {
    var cur = curSess();
    var isGrp = !!(cur && cur.type === 'group');
    // 群里每个成员各用各的模型（跟单聊联系人走），整群没有统一模型可切
    modelbtn.style.display = isGrp ? 'none' : '';
    effortbtn.style.display = isGrp ? 'none' : '';
    var gh = document.getElementById('grouphint');
    if (isGrp) {
      gh.style.display = '';
      gh.textContent = '成员：' + (cur.members || []).map(function (x) { return x.name; })
        .join('、') + '（@名字 点名发言）';
    } else { gh.style.display = 'none'; }
    var m = LOOK.model || '', e = LOOK.effort || '';
    modelbtn.textContent = m ? (MODEL_NAMES[m] || m) : '默认模型';
    effortbtn.textContent = e ? EFFORT_NAMES[e] : '默认';
    modelmenu.querySelectorAll('.mi[data-model]').forEach(function (mi) {
      mi.classList.toggle('on', mi.dataset.model === m);
    });
    effortmenu.querySelectorAll('.mi[data-effort]').forEach(function (mi) {
      mi.classList.toggle('on', mi.dataset.effort === e);
    });
  }
  function closeMenus() {
    modelmenu.classList.remove('open');
    effortmenu.classList.remove('open');
    document.getElementById('morewrap').style.display = 'none';
  }
  function setPref(key, val, label) {
    var body = { key: SKEY };   // 模型/effort是每个会话自己的
    body[key] = val;
    fetch('/prefs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) { chip('没切成：' + (key === 'model' ? '型号名' : 'effort') + '不合法'); return; }
      chip('已切换到 ' + label + '，下一条消息生效');
      loadLook();
    }).catch(function () { chip('没切成：桥接没响应'); });
    closeMenus();
  }
  modelbtn.addEventListener('click', function (e) {
    e.stopPropagation();
    effortmenu.classList.remove('open');
    modelmenu.classList.toggle('open');
  });
  effortbtn.addEventListener('click', function (e) {
    e.stopPropagation();
    modelmenu.classList.remove('open');
    effortmenu.classList.toggle('open');
  });
  modelmenu.addEventListener('click', function (e) {
    e.stopPropagation();
    var mi = e.target.closest('.mi');
    if (!mi) return;
    if (mi.id === 'moretoggle') {
      var mw = document.getElementById('morewrap');
      mw.style.display = mw.style.display === 'block' ? 'none' : 'block';
      return;
    }
    if (mi.dataset.model !== undefined) {
      setPref('model', mi.dataset.model,
              mi.dataset.model ? (MODEL_NAMES[mi.dataset.model] || mi.dataset.model) : '默认模型');
    }
  });
  effortmenu.addEventListener('click', function (e) {
    e.stopPropagation();
    var mi = e.target.closest('.mi');
    if (mi && mi.dataset.effort !== undefined) {
      setPref('effort', mi.dataset.effort,
              mi.dataset.effort ? 'Effort ' + EFFORT_NAMES[mi.dataset.effort] : '默认 effort');
    }
  });
  document.addEventListener('click', closeMenus);
  document.addEventListener('keydown', function (e) {
    if (!modelmenu.classList.contains('open')) return;
    var map = { '1': 'fable', '2': 'opus', '3': 'sonnet', '4': 'haiku' };
    if (map[e.key]) {
      e.preventDefault();
      setPref('model', map[e.key], MODEL_NAMES[map[e.key]]);
    }
  });

  function openPanel() {
    loadStickers().then(function () { renderTabs(); renderGrid(); });
    panel.classList.add('open');
    emobtn.classList.add('on');
  }
  function closePanel() {
    panel.classList.remove('open');
    emobtn.classList.remove('on');
  }
  emobtn.addEventListener('click', function () {
    if (panel.classList.contains('open')) closePanel(); else openPanel();
  });
  tabsEl.addEventListener('click', function (e) {
    var t = e.target.dataset ? e.target.dataset.tab : null;
    if (t === undefined || t === null) return;
    curTab = Number(t);
    renderTabs(); renderGrid();
    gridEl.scrollTop = 0;
  });
  gridEl.addEventListener('click', function (e) {
    var d = e.target.dataset || {};
    if (d.emo) {                      // 表情：插进输入框，可以跟话混着打
      insertAtCursor(d.emo);
      pushRecent(d.emo);
    } else if (d.stk) {               // 表情包：直接发出去
      closePanel();
      send(d.stk);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && panel.classList.contains('open')) {
      e.preventDefault();   // 这下Esc用来关表情面板，不触发停止
      closePanel();
    }
  });

  /* ── 待发图片 ── */
  function renderPending() {
    strip.innerHTML = '';
    pending.forEach(function (p, i) {
      var w = document.createElement('span');
      w.className = 'pend';
      w.innerHTML = '<img src="' + p.url + '"><a data-i="' + i + '">×</a>';
      strip.appendChild(w);
    });
    strip.style.display = pending.length ? 'flex' : 'none';
  }
  strip.addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.i !== undefined) {
      pending.splice(Number(e.target.dataset.i), 1);
      renderPending();
    }
  });
  function addFile(f) {
    if (!f || String(f.type).indexOf('image/') !== 0) return;
    pending.push({ file: f, url: URL.createObjectURL(f) });
    renderPending();
  }
  document.getElementById('attach').addEventListener('click', function () {
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    for (var i = 0; i < fileInput.files.length; i++) addFile(fileInput.files[i]);
    fileInput.value = '';
  });
  ta.addEventListener('paste', function (e) {
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        addFile(items[i].getAsFile());
        e.preventDefault();
      }
    }
  });
  function extOf(f) {
    var m = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp' };
    return m[f.type] || 'png';
  }

  async function stopRun() {
    if (!busy) return;
    var rid = curRid;
    btn.textContent = '停止中';
    try {
      await fetch('/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rid: rid })
      });
    } catch (e) { /* 后端已经没了也无所谓 */ }
    if (curAbort) { try { curAbort.abort(); } catch (e) {} }
  }

  function setBusy(on) {
    busy = on;
    btn.disabled = false;
    btn.textContent = on ? '■' : '发送';
    btn.title = on ? '停止（Esc）' : '';
    btn.classList.toggle('stopping', on);
  }

  async function send(stickerId) {
    if (busy) return;
    var text = stickerId ? '' : ta.value.trim();
    var imgs = stickerId ? [] : pending.slice();
    var stks = stickerId ? [stickerId] : [];
    if (!text && !imgs.length && !stks.length) return;
    if (!stickerId) {
      ta.value = '';
      pending = [];
      renderPending();
    }
    curRid = 'r' + Date.now() + '-' + Math.floor(Math.random() * 100000);
    curAbort = new AbortController();
    setBusy(true);

    var uhtml = md(text);
    imgs.forEach(function (p) { uhtml += '<img src="' + p.url + '">'; });
    stks.forEach(function (id) {
      uhtml += '<img class="sticker" src="' + stickerUrl(id) + '">';
    });
    bubble('user', uhtml);
    var typing = bubble('bot', '<span class="dots"></span>');
    startStatus(typing.querySelector('.dots'));

    try {
      var paths = [];
      for (var i = 0; i < imgs.length; i++) {
        var up = await fetch('/upload?ext=' + extOf(imgs[i].file), {
          method: 'POST', body: imgs[i].file
        });
        var uj = await up.json();
        paths.push(uj.path);
      }
      var res = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, images: paths, stickers: stks, rid: curRid, skey: SKEY }),
        signal: curAbort.signal
      });
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      while (true) {
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          var line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line) continue;
          var ev;
          try { ev = JSON.parse(line); } catch (e) { continue; }
          handle(ev);
          chat.appendChild(typing);
          chat.scrollTop = chat.scrollHeight;
        }
      }
    } catch (e) {
      if (!(e && e.name === 'AbortError')) {
        bubble('bot', '<span class="err">连接断了：' + esc(String(e)) + '</span>');
      }
    }
    stopStatus();
    typing.remove();
    curRid = null; curAbort = null;
    setBusy(false);
    loadLook();       // Claude 这轮要是换了头像/背景，回复一结束就生效
    loadSessions();   // 会话名/摘要/时间也可能变了
    ta.focus();
  }

  btn.addEventListener('click', function () {
    if (busy) { stopRun(); } else { send(); }
  });
  // Esc 也能停
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && busy && !e.defaultPrevented) {
      e.preventDefault();
      stopRun();
    }
  });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  loadStickers();   // 先把表情包名字表拉下来，Claude 一上来就发表情也认得出
  loadSessions().then(loadLook).then(function () {
    if (SKEY) renderHistory(SKEY);   // 重开窗口不丢：从档案回放
  });
  ta.focus();
</script>
