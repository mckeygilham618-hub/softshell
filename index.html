<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* 表情用系统自带的彩色表情字体渲染。长什么样由用户自己的 Windows/Mac 决定，
     所以这里只点名字体，不带任何图片资源。 */
  body {
    margin: 0; background: #ededed; display: flex; flex-direction: column;
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei",
          "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    color: #1a1a1a;
  }
  header {
    background: #f7f7f7; border-bottom: 1px solid #ddd;
    padding: 10px 14px; text-align: center; font-weight: 600; position: relative;
    flex: none;
  }
  #newbtn {
    position: absolute; right: 10px; top: 7px; background: none; border: 1px solid #ccc;
    border-radius: 5px; padding: 3px 10px; font-size: 12px; color: #666; cursor: pointer;
  }
  #newbtn:hover { background: #eee; }
  #chat {
    flex: 1; overflow-y: auto; padding: 14px 12px 20px;
    background-size: cover; background-position: center;
  }
  .row { display: flex; margin: 9px 0; gap: 8px; }
  .row.user { justify-content: flex-end; }
  /* 头像：默认纯色方块（Claude白、用户绿），换过图就盖在上面 */
  .avatar {
    width: 38px; height: 38px; border-radius: 4px; flex: none;
    overflow: hidden; margin-top: 1px;
  }
  .avatar.claude { background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
  .avatar.user { background: #07c160; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .bubble {
    max-width: 80%; padding: 9px 12px; border-radius: 8px; background: #fff;
    box-shadow: 0 1px 1px rgba(0,0,0,.06); word-break: break-word;
  }
  .user .bubble { background: #95ec69; }
  .thought .bubble {
    background: transparent; box-shadow: none; color: #9a9a9a;
    font-size: 13px; padding: 2px 12px; margin-left: 46px;
  }
  .bubble img { max-width: 220px; border-radius: 6px; display: block; margin: 4px 0; }
  /* 表情包气泡：不切图，整张缩进去 */
  .bubble img.sticker { max-width: 140px; max-height: 140px; object-fit: contain; }
  .chip { text-align: center; color: #b0b0b0; font-size: 12px; margin: 5px 0; }
  .err { color: #d64541; }
  pre {
    background: #f6f6f6; border: 1px solid #e8e8e8; border-radius: 6px;
    padding: 8px 10px; overflow-x: auto; font-size: 13px; line-height: 1.5; margin: 6px 0;
  }
  code { background: #f0f0f0; border-radius: 3px; padding: 1px 4px; font-size: 13px; }
  pre code { background: none; padding: 0; }
  #strip {
    display: none; gap: 8px; padding: 6px 10px; background: #f7f7f7;
    border-top: 1px solid #ddd; flex: none; flex-wrap: wrap;
  }
  .pend { position: relative; }
  .pend img { height: 52px; border-radius: 5px; display: block; }
  .pend a {
    position: absolute; top: -6px; right: -6px; background: #888; color: #fff;
    border-radius: 50%; width: 17px; height: 17px; line-height: 17px;
    text-align: center; font-size: 11px; cursor: pointer;
  }

  /* ── 表情面板 ── */
  #panel {
    display: none; flex-direction: column; height: 252px; flex: none;
    background: #f7f7f7; border-top: 1px solid #ddd;
  }
  #panel.open { display: flex; }
  #tabs {
    display: flex; gap: 3px; padding: 6px 8px; flex: none;
    border-bottom: 1px solid #e5e5e5; overflow-x: auto; white-space: nowrap;
  }
  .tab {
    padding: 4px 11px; border-radius: 6px; font-size: 13px; color: #666;
    cursor: pointer; flex: none;
  }
  .tab:hover { background: #ececec; }
  .tab.on { background: #e0e0e0; color: #111; }
  #grid { flex: 1; overflow-y: auto; padding: 4px 8px 10px; }
  .gtitle { font-size: 12px; color: #a5a5a5; margin: 8px 2px 2px; }
  .grow { display: flex; flex-wrap: wrap; }
  .emo {
    width: 36px; height: 36px; line-height: 36px; text-align: center;
    font-size: 21px; cursor: pointer; border-radius: 6px; user-select: none;
  }
  .emo:hover { background: #e6e6e6; }
  .stk {
    width: 74px; height: 74px; margin: 3px; padding: 2px; cursor: pointer;
    background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
    object-fit: contain;   /* 竖图横图都完整显示，一个像素都不切 */
  }
  .stk:hover { border-color: #07c160; }
  .empty { color: #999; font-size: 13px; padding: 16px 6px; line-height: 1.9; }
  .empty b { color: #666; font-weight: 600; }

  footer {
    background: #f7f7f7; border-top: 1px solid #ddd; padding: 8px;
    display: flex; gap: 6px; flex: none; align-items: flex-end;
  }
  #emobtn, #attach {
    background: none; border: 1px solid #ccc; border-radius: 6px; color: #555;
    font-size: 18px; padding: 8px 11px; cursor: pointer; flex: none;
  }
  #emobtn:hover, #attach:hover { background: #eee; }
  #emobtn.on { background: #e3e3e3; border-color: #aaa; }
  textarea {
    flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 9px 10px;
    resize: none; height: 46px; font: inherit; outline: none; background: #fff;
  }
  textarea:focus { border-color: #07c160; }
  #send {
    background: #07c160; color: #fff; border: 0; border-radius: 6px;
    padding: 11px 18px; font: inherit; cursor: pointer; flex: none;
  }
  #send:disabled { opacity: .45; cursor: default; }
  #send.stopping { background: #8a8a8a; }
  .dots { color: #999; font-size: 13px; }
</style>

</header>

<div id="strip"></div>
<div id="panel">

    ['食物', '🍎|苹果 🍊|橘子 🍋|柠檬 🍌|香蕉 🍉|西瓜 🍇|葡萄 🍓|草莓 🍑|桃子 🥭|芒果 🍍|菠萝 🥝|猕猴桃 🍅|番茄 🥑|牛油果 🌽|玉米 🥕|胡萝卜 🍞|面包 🥐|可颂 🧀|奶酪 🍖|肉 🍗|鸡腿 🍔|汉堡 🍟|薯条 🍕|披萨 🌭|热狗 🥪|三明治 🌮|塔可 🍜|拉面 🍝|意面 🍣|寿司 🍱|便当 🍚|米饭 🥟|饺子 🍤|炸虾 🍦|冰淇淋 🍩|甜甜圈 🍪|饼干 🎂|生日蛋糕 🍰|蛋糕 🧁|纸杯蛋糕 🍫|巧克力 🍬|糖 🍭|棒棒糖 ☕|咖啡 🍵|茶 🧋|奶茶 🍺|啤酒 🍻|干杯 🥂|香槟 🍷|红酒 🥤|饮料'],
    ['活动', '🎉|庆祝 🎊|彩带 🎈|气球 🎁|礼物 🧧|红包 🎀|蝴蝶结 🎄|圣诞树 🎃|南瓜 🎆|烟花 🏆|奖杯 🥇|金牌 🥈|银牌 🥉|铜牌 ⚽|足球 🏀|篮球 🏓|乒乓 🎮|游戏 🎯|靶心 🎲|骰子 🎵|音符 🎶|音乐 🎤|麦克风 🎧|耳机 📷|相机 🎬|开拍 🚀|火箭'],
    ['物品', '💰|钱 💵|钞票 💳|银行卡 📱|手机 💻|电脑 ⌨️|键盘 🖱️|鼠标 🖨️|打印机 📚|书 📖|翻书 ✏️|铅笔 🖊️|笔 📝|记一下 📌|图钉 📎|回形针 🔍|放大镜 🔑|钥匙 🔒|锁 🔔|铃 📢|喇叭 ⏰|闹钟 ⌛|沙漏 📅|日历 📊|图表 🗑️|垃圾桶 🛠️|工具 ⚙️|设置 🔋|电池 💡|灯泡'],
    ['符号', '✅|对 ❌|错 ⭕|圈 ❓|问号 ❗|感叹号 ‼️|双感叹 ⚠️|警告 🈲|禁止 🆗|好的 🆕|新 🔴|红 🟠|橙 🟡|黄 🟢|绿 🔵|蓝 🟣|紫 ⚫|黑 ⚪|白 ♻️|回收 ☀️|太阳 🌙|月亮 ☁️|云 🌧️|下雨 ⛈️|雷雨 ❄️|雪花 ⛄|雪人 🌈|彩虹 💧|水滴 🌊|海浪']
  ];
  var EMOJI_NAME = {};
  EMOJI.forEach(function (cat) {
    cat[1].split(' ').forEach(function (pair) {
      var i = pair.indexOf('|');
      if (i > 0) EMOJI_NAME[pair.slice(0, i)] = pair.slice(i + 1);
    });
  });

  var STICKERS = [];   // [{name:'用户专用', items:['a.jpg',...]}]
  var STK_MAP = {};    // 表情名 -> '用户专用/a.jpg'
  var curTab = 0;      // 0 = 表情，1起 = 各个表情包文件夹

  function stickerUrl(id) { return '/sticker?f=' + encodeURIComponent(id); }

  function esc(s) {
    // 也转义引号：文件名会被塞进 title/alt 属性里
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function unesc(s) {
    return s.replace(/&quot;/g, '"').replace(/&gt;/g, '>')
            .replace(/&lt;/g, '<').replace(/&amp;/g, '&');
  }
  function md(s) {
    var parts = String(s).split('```');
    var html = '';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (i % 2 === 1) {
        var nl = p.indexOf('\n');
        var code = nl >= 0 ? p.slice(nl + 1) : p;
        html += '<pre>' + esc(code) + '</pre>';
      } else {
        var t = esc(p);
        // Claude 写 [[表情:名字]] 就渲染成那张表情包；认不出的名字原样留着，好排查
        t = t.replace(/\[\[(?:表情|sticker)[:：]\s*([^\]]+?)\s*\]\]/g, function (m, name) {
          var id = STK_MAP[unesc(name)];
          return id ? '<img class="sticker" src="' + stickerUrl(id) + '" alt="' + name + '">' : m;
        });
        t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        t = t.replace(/\n/g, '<br>');
        html += t;
      }
    }
    return html;
  }
  function avatarHtml(who) {
    var rel = LOOK['avatar_' + who] || '';
    var img = rel
      ? '<img src="' + stickerUrl(rel) + '" style="display:block" ' +
        'onerror="this.style.display=\'none\'">'
      : '<img style="display:none">';
    return '<div class="avatar ' + who + '">' + img + '</div>';
  }
  function bubble(cls, html) {
    var d = document.createElement('div');
    d.className = 'row ' + cls;
    var inner = '<div class="bubble">' + html + '</div>';
    if (cls === 'bot') d.innerHTML = avatarHtml('claude') + inner;
    else if (cls === 'user') d.innerHTML = inner + avatarHtml('user');
    else d.innerHTML = inner;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }
  function chip(text) {
    var d = document.createElement('div');
    d.className = 'chip';
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }
  function handle(ev) {
    if (ev.kind === 'text') bubble('bot', md(ev.text));
    else if (ev.kind === 'thinking') bubble('thought', md(ev.text));
    else if (ev.kind === 'tool') chip('⚙ ' + ev.name);
    else if (ev.kind === 'note') chip(ev.text);
    else if (ev.kind === 'error') bubble('bot', '<span class="err">' + md(ev.text) + '</span>');
  }

  /* ── 表情面板 ── */
  function getRecent() {
    try { return JSON.parse(localStorage.getItem('recentEmoji') || '[]'); } catch (e) { return []; }
  }
  function pushRecent(ch) {
    try {
      var r = getRecent().filter(function (x) { return x !== ch; });
      r.unshift(ch);
      localStorage.setItem('recentEmoji', JSON.stringify(r.slice(0, 16)));
    } catch (e) { /* 无痕模式之类的，存不了就算了 */ }
  }
  function insertAtCursor(s) {
    var st = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    ta.value = v.slice(0, st) + s + v.slice(en);
    ta.selectionStart = ta.selectionEnd = st + s.length;
    ta.focus();
  }
  function emojiCells(pairs) {
    var h = '<div class="grow">';
    pairs.forEach(function (pair) {
      var i = pair.indexOf('|');
      var ch = i > 0 ? pair.slice(0, i) : pair;
      var nm = i > 0 ? pair.slice(i + 1) : (EMOJI_NAME[pair] || '');
      h += '<span class="emo" data-emo="' + esc(ch) + '" title="' + esc(nm) + '">' + esc(ch) + '</span>';
    });
    return h + '</div>';
  }
  function renderTabs() {
    var h = '<span class="tab' + (curTab === 0 ? ' on' : '') + '" data-tab="0">表情</span>';
    STICKERS.forEach(function (g, i) {
      h += '<span class="tab' + (curTab === i + 1 ? ' on' : '') + '" data-tab="' + (i + 1) +
           '">' + esc(g.name) + '</span>';
    });
    tabsEl.innerHTML = h;
  }
  function renderGrid() {
    if (curTab === 0) {
      var h = '';
      var rec = getRecent();
      if (rec.length) h += '<div class="gtitle">最近使用</div>' + emojiCells(rec);
      EMOJI.forEach(function (cat) {
        h += '<div class="gtitle">' + esc(cat[0]) + '</div>' + emojiCells(cat[1].split(' '));
      });
      gridEl.innerHTML = h;
      return;
    }
    var g = STICKERS[curTab - 1];
    if (!g) { gridEl.innerHTML = ''; return; }
    if (!g.items.length) {
      gridEl.innerHTML = '<div class="empty">这个文件夹还是空的。<br>' +
        '把图片拖进 <b>stickers\\' + esc(g.name) + '\\</b> 就会出现在这里，<br>' +
        '不用重启，关掉面板再点开就有了。</div>';
      return;
    }
    var h = '<div class="grow">';
    g.items.forEach(function (fn) {
      var id = g.name + '/' + fn;
      var nm = fn.replace(/\.[^.]+$/, '');
      h += '<img class="stk" src="' + stickerUrl(id) + '" data-stk="' + esc(id) +
           '" title="' + esc(nm) + '" alt="' + esc(nm) + '">';
    });
    gridEl.innerHTML = h + '</div>';
  }
  function loadStickers() {
    return fetch('/stickers').then(function (r) { return r.json(); }).then(function (g) {
      STICKERS = g || [];
      STK_MAP = {};
      STICKERS.forEach(function (grp) {
        grp.items.forEach(function (fn) {
          var id = grp.name + '/' + fn;
          var bare = fn.replace(/\.[^.]+$/, '');
          // 四种写法都认：文件名、带后缀、带文件夹、文件夹+后缀
          STK_MAP[bare] = STK_MAP[bare] || id;
          STK_MAP[fn] = id;
          STK_MAP[grp.name + '/' + bare] = id;
          STK_MAP[id] = id;
        });
      });
      if (curTab > STICKERS.length) curTab = 0;
    }).catch(function () { /* 桥接还没起来，下次点开面板再试 */ });
  }
  /* ── 外观：头像和聊天背景。状态在 state.json 里，Claude 改完它，
        这里拉一次 /look 就全变了 ── */
  var LOOK = {};
  function applyLook() {
    chat.style.backgroundImage =
      LOOK.background ? 'url("' + stickerUrl(LOOK.background) + '")' : '';
    document.querySelectorAll('.avatar').forEach(function (a) {
      var who = a.classList.contains('claude') ? 'claude' : 'user';
      var rel = LOOK['avatar_' + who] || '';
      var img = a.querySelector('img');
      if (!img) return;
      if (rel) {
        img.onerror = function () { this.style.display = 'none'; };
        img.src = stickerUrl(rel) + '&t=' + Date.now();
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
        img.removeAttribute('src');
      }
    });
  }
  function loadLook() {
    return fetch('/look').then(function (r) { return r.json(); })
      .then(function (l) { LOOK = l || {}; applyLook(); })
      .catch(function () { /* 桥接还没起来就算了 */ });
  }

  function openPanel() {
    loadStickers().then(function () { renderTabs(); renderGrid(); });
    panel.classList.add('open');
    emobtn.classList.add('on');
  }
  function closePanel() {
    panel.classList.remove('open');
    emobtn.classList.remove('on');
  }
  emobtn.addEventListener('click', function () {
    if (panel.classList.contains('open')) closePanel(); else openPanel();
  });
  tabsEl.addEventListener('click', function (e) {
    var t = e.target.dataset ? e.target.dataset.tab : null;
    if (t === undefined || t === null) return;
    curTab = Number(t);
    renderTabs(); renderGrid();
    gridEl.scrollTop = 0;
  });
  gridEl.addEventListener('click', function (e) {
    var d = e.target.dataset || {};
    if (d.emo) {                      // 表情：插进输入框，可以跟话混着打
      insertAtCursor(d.emo);
      pushRecent(d.emo);
    } else if (d.stk) {               // 表情包：直接发出去
      closePanel();
      send(d.stk);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
  });

  /* ── 待发图片 ── */
  function renderPending() {
    strip.innerHTML = '';
    pending.forEach(function (p, i) {
      var w = document.createElement('span');
      w.className = 'pend';
      w.innerHTML = '<img src="' + p.url + '"><a data-i="' + i + '">×</a>';
      strip.appendChild(w);
    });
    strip.style.display = pending.length ? 'flex' : 'none';
  }
  strip.addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.i !== undefined) {
      pending.splice(Number(e.target.dataset.i), 1);
      renderPending();
    }
  });
  function addFile(f) {
    if (!f || String(f.type).indexOf('image/') !== 0) return;
    pending.push({ file: f, url: URL.createObjectURL(f) });
    renderPending();
  }
  document.getElementById('attach').addEventListener('click', function () {
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    for (var i = 0; i < fileInput.files.length; i++) addFile(fileInput.files[i]);
    fileInput.value = '';
  });
  ta.addEventListener('paste', function (e) {
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        addFile(items[i].getAsFile());
        e.preventDefault();
      }
    }
  });
  function extOf(f) {
    var m = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp' };
    return m[f.type] || 'png';
  }

  async function stopRun() {
    if (!busy) return;
    var rid = curRid;
    btn.textContent = '停止中';
    try {
      await fetch('/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rid: rid })
      });
    } catch (e) { /* 后端已经没了也无所谓 */ }
    if (curAbort) { try { curAbort.abort(); } catch (e) {} }
  }

  function setBusy(on) {
    busy = on;
    btn.disabled = false;
    btn.textContent = on ? '■' : '发送';
    btn.title = on ? '停止（Esc）' : '';
    btn.classList.toggle('stopping', on);
  }

  async function send(stickerId) {
    if (busy) return;
    var text = stickerId ? '' : ta.value.trim();
    var imgs = stickerId ? [] : pending.slice();
    var stks = stickerId ? [stickerId] : [];
    if (!text && !imgs.length && !stks.length) return;
    if (!stickerId) {
      ta.value = '';
      pending = [];
      renderPending();
    }
    curRid = 'r' + Date.now() + '-' + Math.floor(Math.random() * 100000);
    curAbort = new AbortController();
    setBusy(true);

    var uhtml = md(text);
    imgs.forEach(function (p) { uhtml += '<img src="' + p.url + '">'; });
    stks.forEach(function (id) {
      uhtml += '<img class="sticker" src="' + stickerUrl(id) + '">';
    });
    bubble('user', uhtml);
    var typing = bubble('bot', '<span class="dots">正在思考…</span>');

    try {
      var paths = [];
      for (var i = 0; i < imgs.length; i++) {
        var up = await fetch('/upload?ext=' + extOf(imgs[i].file), {
          method: 'POST', body: imgs[i].file
        });
        var uj = await up.json();
        paths.push(uj.path);
      }
      var res = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, images: paths, stickers: stks, rid: curRid }),
        signal: curAbort.signal
      });
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      while (true) {
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          var line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line) continue;
          var ev;
          try { ev = JSON.parse(line); } catch (e) { continue; }
          handle(ev);
          chat.appendChild(typing);
          chat.scrollTop = chat.scrollHeight;
        }
      }
    } catch (e) {
      if (!(e && e.name === 'AbortError')) {
        bubble('bot', '<span class="err">连接断了：' + esc(String(e)) + '</span>');
      }
    }
    typing.remove();
    curRid = null; curAbort = null;
    setBusy(false);
    loadLook();   // Claude 这轮要是换了头像/背景，回复一结束就生效
    ta.focus();
  }

  btn.addEventListener('click', function () {
    if (busy) { stopRun(); } else { send(); }
  });
  // Esc 也能停
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && busy) { e.preventDefault(); stopRun(); }
  });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.getElementById('newbtn').addEventListener('click', function () {
    fetch('/new', { method: 'POST' }).then(function () {
      chat.innerHTML = '';
      bubble('bot', '新对话开始了。');
      ta.focus();
    });
  });

  loadStickers();   // 先把表情包名字表拉下来，Claude 一上来就发表情也认得出
  loadLook();       // 恢复上次的头像和聊天背景
  ta.focus();
</script>
